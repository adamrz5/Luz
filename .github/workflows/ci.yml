name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and check application and installer
        shell: pwsh
        run: ./tools/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/distribucion/*
          if-no-files-found: error

  install:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Install, open, close and uninstall
        shell: pwsh
        run: |
          $expected = ((Get-Content installer/SHA256SUMS.txt).Trim() -split '\s+')[0]
          ./tools/Test-Installer.ps1 -Installer "$PWD/installer/Luz-instalador.exe" -ExpectedSha256 $expected -ResultsDirectory "$PWD/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-results
          path: results/*
          if-no-files-found: warn
